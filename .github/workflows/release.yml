name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag against plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(jq -r '.version' info.json)"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match info.json version $VERSION"
            exit 1
          fi

      - name: Package plugin
        run: |
          mkdir -p dist/SpamDetector
          cp info.json init.lua LICENSE README.md dist/SpamDetector/
          (cd dist && zip -r SpamDetector.zip SpamDetector)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/SpamDetector.zip \
            --title "Chatterino SpamDetector $GITHUB_REF_NAME" \
            --generate-notes